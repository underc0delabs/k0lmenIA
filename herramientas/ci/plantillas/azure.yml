# k0lmena en CI (Azure Pipelines). Generado con: npm run ci -- generar --plataforma azure
#
# Corre las suites de k0lmena sin agentes ni tokens, guarda los reportes como artefacto y, si hay
# ciclo (GESTION_CICLO), publica los resultados en Xray, QMetry, AIO Tests o Zephyr.
#
# Configuración (Pipelines > Library):
#   - Secure file "k0lmenia.env": el contenido de tu .env (APP_URL, GESTION_HERRAMIENTA, GESTION_PROYECTO
#     y los tokens de la herramienta de gestión). Autorizalo para este pipeline.
#   - Variable GESTION_CICLO (opcional, del pipeline o al correrlo): key del ciclo donde publicar (ej. PROJ-60).
# Nunca pongas valores en este archivo.

trigger:
  branches:
    include: [main]

pr:
  branches:
    include: ['*']

pool:
  vmImage: ubuntu-latest

variables:
  K0LMENA_SUITES: "__SUITES__"

jobs:
  - job: k0lmena
    displayName: Suites de k0lmena
    timeoutInMinutes: 60
    steps:
      - task: UseNode@1
        inputs:
          version: "22.x"

      - task: UsePythonVersion@0
        inputs:
          versionSpec: "3.12"

      - task: DownloadSecureFile@1
        name: envSeguro
        displayName: .env desde Secure files
        inputs:
          secureFile: k0lmenia.env

      - script: |
          npm ci --prefix herramientas/k0lmena
          cd herramientas/k0lmena && npx playwright install --with-deps chromium
        displayName: Dependencias de k0lmena y navegador

      - script: |
          estado=0
          for suite in $K0LMENA_SUITES; do npm run test:$suite || estado=1; done
          echo "##vso[task.setvariable variable=ESTADO_SUITES]$estado"
        displayName: Suites de k0lmena
        env:
          K0LMENA_ENV_FILE: $(envSeguro.secureFilePath)

      - script: |
          python -m pip install -r requirements.txt
          python herramientas/ci/ci.py publicar --suites "$K0LMENA_SUITES"
        displayName: Publicar resultados en la herramienta de gestión
        condition: and(always(), ne(variables['GESTION_CICLO'], ''))
        env:
          K0LMENA_ENV_FILE: $(envSeguro.secureFilePath)
          GESTION_CICLO: $(GESTION_CICLO)

      - task: PublishPipelineArtifact@1
        displayName: Reportes
        condition: always()
        inputs:
          targetPath: herramientas/k0lmena/reports
          artifact: reportes-k0lmena

      - script: exit 1
        displayName: Resultado de las suites
        condition: ne(variables['ESTADO_SUITES'], '0')
