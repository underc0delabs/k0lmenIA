# Verificación del propio repo de k0lmenIA: los scripts de Python y Node que usan los agentes.
# No corre las suites de k0lmena (esas necesitan la app bajo prueba): para eso, npm test.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Dependencias de Python
        run: python -m pip install -r requirements-dev.txt

      - name: Tests de Python (pytest, con el control de traducciones de los informes)
        run: python -m pytest tests -q
        env:
          # Falla si un informe en inglés deja interfaz en español (ver tests/conftest.py)
          K0LMENIA_I18N_ESTRICTO: "1"

      - name: Tests de Node
        run: npm run test:repo

      - name: JSON de configuración válidos
        run: |
          node -e "for (const f of ['.mcp.json', '.claude/settings.json', 'package.json', 'herramientas/k0lmena/package.json']) JSON.parse(require('fs').readFileSync(f, 'utf8'))"

  navegador:
    # Las pruebas con un navegador real (header anti-bots solo a la app, detección de desafíos, idiomas de los
    # informes): necesitan k0lmena instalado con Chromium. En el job de arriba se saltean.
    name: Pruebas con navegador real
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: k0lmena y Chromium
        run: |
          npm ci --prefix herramientas/k0lmena
          cd herramientas/k0lmena && npx playwright install --with-deps chromium

      - name: Dependencias de Python
        run: python -m pip install -r requirements-dev.txt

      - name: Tests de Node (incluye los de navegador real)
        run: npm run test:repo

      - name: Tipos de k0lmena
        run: cd herramientas/k0lmena && npx tsc --noEmit -p tsconfig.json
