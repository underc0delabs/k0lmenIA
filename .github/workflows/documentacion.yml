# PDF de la documentación (español e inglés). No se versionan (pesan ~9 MB cada uno y agrandaban el repo en cada
# cambio): este workflow los arma con docs/generar.js al subir cambios de docs/ a main y los publica en el release
# "docs", con una URL fija:
#   https://github.com/underc0delabs/k0lmenIA/releases/download/docs/k0lmenIA-documentacion.pdf
#   https://github.com/underc0delabs/k0lmenIA/releases/download/docs/k0lmenIA-documentation.pdf
# Para generarlos en tu PC: node docs/generar.js (quedan en docs/, ignorados por git).
name: Documentación en PDF

on:
  push:
    branches: [main]
    paths: ["docs/**", ".github/workflows/documentacion.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: documentacion
  cancel-in-progress: true

jobs:
  pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Playwright (el de k0lmena) y pypdf
        run: |
          npm ci --prefix herramientas/k0lmena
          cd herramientas/k0lmena && npx playwright install --with-deps chromium
          python -m pip install pypdf

      - name: Generar los PDF
        run: node docs/generar.js

      - name: Publicar en el release "docs"
        env:
          GH_TOKEN: ${{ github.token }}
        # Se vuelve a crear en cada publicación: GitHub muestra la fecha de creación del release, y con solo
        # reemplazar los archivos parecía viejo. El tag sigue siendo "docs", así que las URLs de descarga no cambian.
        run: |
          FECHA=$(date -u +%Y-%m-%d)
          gh release delete docs --yes --cleanup-tag >/dev/null 2>&1 || true
          gh release create docs docs/k0lmenIA-documentacion.pdf docs/k0lmenIA-documentation.pdf \
            --target "$GITHUB_SHA" --latest=false --title "Documentación (PDF) · $FECHA" \
            --notes "PDF de la documentación de k0lmenIA en español e inglés, generado el $FECHA desde ${GITHUB_SHA::7}. Se actualiza solo con cada cambio de docs/ en main."
